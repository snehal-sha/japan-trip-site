/* Layout: a timetable-journal. Sticky tab rail, one column of cards, time rail on the left of each day. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eaecf1; --fg:#171a21; --muted:#5d6472; --line:#d9dde5; --line-2:#c4cad6;
  --you:#c8381e; --you-soft:#fbe9e4; --pick:#176f7e; --pick-soft:#dff2f5; --accent:#c8381e;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --chart-surface:#fcfcfb; --grid:#e1e0d9; --axis:#c3c2b7;
  --land:#e7e9ee; --water:#f3f4f7; --coast:#b9c0cc;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"IBM Plex Sans","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  --radius:10px; --shadow:0 1px 2px rgba(23,26,33,.06),0 8px 24px -16px rgba(23,26,33,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1e27; --surface-2:#222734; --fg:#e8eaf0; --muted:#9aa3b2; --line:#2a3040; --line-2:#3a4254;
  --you:#ff7a5c; --you-soft:#3a221c; --pick:#4fc3d9; --pick-soft:#16333a; --accent:#ff7a5c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --chart-surface:#1a1a19; --grid:#2c2c2a; --axis:#383835;
  --land:#232835; --water:#12151c; --coast:#3d4556; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1e27; --surface-2:#222734; --fg:#e8eaf0; --muted:#9aa3b2; --line:#2a3040; --line-2:#3a4254;
  --you:#ff7a5c; --you-soft:#3a221c; --pick:#4fc3d9; --pick-soft:#16333a; --accent:#ff7a5c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --chart-surface:#1a1a19; --grid:#2c2c2a; --axis:#383835;
  --land:#232835; --water:#12151c; --coast:#3d4556; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.35rem;line-height:1.25}
h3{font-size:1.08rem}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
header.top{padding-block:18px 10px}
header.top .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.countdown{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.countdown b{color:var(--fg);font-weight:600}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer;font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
main{padding-block:18px 60px}
section.view[hidden]{display:none}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.flat{background:transparent;border-color:transparent;padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;letter-spacing:.02em;line-height:1.5;white-space:nowrap}
.chip.you{background:var(--you-soft);color:var(--you)}
.chip.pick{background:var(--pick-soft);color:var(--pick)}
.chip.tag{background:var(--surface-2);color:var(--muted);font-weight:500}
.chip.day{background:var(--surface-2);color:var(--fg);font-family:var(--mono);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.link{color:var(--pick);text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
/* day cards */
.day{display:grid;grid-template-columns:1fr;gap:12px}
.day-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.day-head .date{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.why{border-left:3px solid var(--line-2);padding:4px 12px;color:var(--muted);font-size:.92rem}
.stops{display:grid;gap:0;border-top:1px solid var(--line)}
.stop{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.stop .t{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:3px}
.stop.opt{background:repeating-linear-gradient(90deg,transparent 0 6px,var(--surface-2) 6px 7px) left top/100% 1px no-repeat}
.stop.opt .t{color:var(--pick)}
.stop .name{font-weight:600;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.stop .name button.pl{border:0;background:transparent;padding:0;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;text-align:left}
.stop .name button.pl:hover{color:var(--pick)}
.stop .note{color:var(--fg);font-size:.92rem}
.stop .travel{color:var(--muted);font-size:.82rem;font-family:var(--mono);margin-top:4px}
.stop .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:4px;font-size:.82rem}
.stop.done .name,.stop.done .note{opacity:.5;text-decoration:line-through}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--pick);flex:0 0 auto}
.check label{cursor:pointer;flex:1;min-width:0}
.check.done label{opacity:.55;text-decoration:line-through}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--pick)}
/* places */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 180px;min-width:0;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.filters select{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.place{display:grid;gap:4px}
.place .head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.place .head b{font-size:1rem}
.kv{display:grid;grid-template-columns:92px 1fr;gap:2px 10px;font-size:.88rem}
.kv dt{color:var(--muted);font-family:var(--mono);font-size:.74rem;padding-top:2px}
.kv dd{margin:0;min-width:0}
.rating{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
/* map */
.mapwrap{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){.mapwrap{grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr)}}
.mapbox{position:relative;background:var(--water);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-width:100%}
.mapbox .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:4px 8px;border-radius:6px;font-size:.78rem;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .12s}
.mapbox .tip.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.hops{display:grid;gap:0}
.hop{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.86rem;align-items:start}
.hop .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);padding-top:2px}
.hop .d{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:right;white-space:nowrap}
.hop.cur{background:var(--surface-2)}
/* budget */
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:.78rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto;max-width:100%}
input.amt{width:110px;text-align:right;font-family:var(--mono);padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.tile .v{font-family:var(--mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:.76rem;color:var(--muted)}
.chart{background:var(--chart-surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.chart svg{width:100%;height:auto;display:block}
form.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.exp input,form.exp select{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-width:0;width:100%}
form.exp .full{grid-column:1/-1}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* guide */
.guide h3{margin-bottom:6px}
.phr{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.phr .jp{font-family:var(--display);font-size:1.1rem}
.phr .ro{font-family:var(--mono);font-size:.8rem;color:var(--pick)}
/* drawer */
.drawer{position:fixed;inset:auto 0 0 0;max-height:82vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);z-index:40;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.drawer[hidden]{display:none}
.drawer .close{position:absolute;top:10px;right:14px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
.scrim[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hero{display:grid;gap:10px}
.hero .big{font-family:var(--display);font-size:2.2rem;line-height:1.1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.stop{grid-template-columns:52px 1fr}.kv{grid-template-columns:78px 1fr}form.exp{grid-template-columns:1fr}}
/* ---- kawaii layer: pastel tokens, hero collage, stickers, covers ---- */
:root{--sakura:#f7a8c4;--matcha:#a8d08d;--sky:#8fd0ee;--yolk:#ffd166;--grape:#c4b5fd;--band:linear-gradient(135deg,#ffe3ec 0%,#e3f3ff 55%,#fff3cf 100%);--pattern:rgba(23,26,33,.07)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sakura:#e9869f;--matcha:#86b76e;--sky:#6fb6d8;--yolk:#e6b84a;--grape:#a995f5;--band:linear-gradient(135deg,#2a1f33 0%,#17243a 55%,#2e2a1a 100%);--pattern:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--sakura:#e9869f;--matcha:#86b76e;--sky:#6fb6d8;--yolk:#e6b84a;--grape:#a995f5;--band:linear-gradient(135deg,#2a1f33 0%,#17243a 55%,#2e2a1a 100%);--pattern:rgba(255,255,255,.07)}
header.top{background:var(--band);border-bottom:1px solid var(--line);position:relative;overflow:hidden;padding-block:22px 20px}
header.top::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,transparent 9px,var(--pattern) 10px,transparent 11.5px) 0 0/28px 14px,radial-gradient(circle at 0 100%,transparent 9px,var(--pattern) 10px,transparent 11.5px) 14px 7px/28px 14px;pointer-events:none}
header.top .wrap{position:relative}
.hero-grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media (min-width:760px){.hero-grid{grid-template-columns:1.05fr 1fr}}
.collage{position:relative;height:200px;max-width:520px}
.collage .ph{position:absolute;width:46%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--surface);padding:5px;box-shadow:0 12px 26px -14px rgba(0,0,0,.5)}
.collage .ph img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.collage .ph:nth-child(1){left:0;top:14px;transform:rotate(-5deg)}
.collage .ph:nth-child(2){left:29%;top:0;transform:rotate(3deg);z-index:2}
.collage .ph:nth-child(3){right:0;top:26px;transform:rotate(-2deg)}
.collage .st{position:absolute;z-index:3;width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.28))}
.collage .st.a{left:23%;bottom:-4px;transform:rotate(-10deg)}
.collage .st.b{right:7%;top:-6px;transform:rotate(12deg)}
.collage .st.c{left:-6px;bottom:30px;width:46px;height:46px}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.sticker{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:0 2px 0 var(--line),0 8px 16px -10px rgba(0,0,0,.45);flex:0 0 auto}
.sticker .ico{width:30px;height:30px;vertical-align:0}
.sticker.lg{width:66px;height:66px}.sticker.lg .ico{width:48px;height:48px}
nav.tabs button{display:inline-flex;align-items:center;gap:6px}
nav.tabs button .ico{width:1.25em;height:1.25em}
.cover{position:relative;aspect-ratio:16/7;border-radius:14px;overflow:hidden;background:var(--surface-2);max-width:100%;margin-bottom:4px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .daynum{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--fg);font-family:var(--mono);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.cover .mascot{position:absolute;right:14px;bottom:-12px;transform:rotate(8deg)}
.cover .credit{position:absolute;right:10px;top:10px;font-size:.62rem;color:#fff;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:999px;font-family:var(--mono)}
.chip.tag{display:inline-flex;align-items:center;gap:4px}
.chip.tag.cyberpunk,.chip.tag.anime,.chip.tag.arcade{background:color-mix(in srgb,var(--grape) 55%,var(--surface));color:var(--fg)}
.chip.tag.nature,.chip.tag.chill,.chip.tag.countryside{background:color-mix(in srgb,var(--matcha) 55%,var(--surface));color:var(--fg)}
.chip.tag.food{background:color-mix(in srgb,var(--yolk) 60%,var(--surface));color:var(--fg)}
.chip.tag.drinking,.chip.tag.shopping{background:color-mix(in srgb,var(--sakura) 55%,var(--surface));color:var(--fg)}
.chip.tag.drive,.chip.tag.travel,.chip.tag.culture,.chip.tag.spirituality{background:color-mix(in srgb,var(--sky) 55%,var(--surface));color:var(--fg)}
.chip.tag.vintage{background:color-mix(in srgb,var(--yolk) 40%,var(--surface));color:var(--fg)}
.chip .ico{width:1em;height:1em;vertical-align:-.15em}
.h-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.empty{display:flex;gap:12px;align-items:center;color:var(--muted)}
.credits{font-size:.78rem;color:var(--muted);display:grid;gap:4px}
.credits a{color:var(--pick)}
.place .head .ico{width:1.3em;height:1.3em}
.tile{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.tile .sticker{width:38px;height:38px}.tile .sticker .ico{width:26px;height:26px}
.card.flat .h-row h1{margin:0}
@media (prefers-reduced-motion:no-preference){.collage .st{animation:bob 4s ease-in-out infinite}.collage .st.b{animation-delay:1.3s}.collage .st.c{animation-delay:2.1s}@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}}
@media (max-width:520px){.collage{height:150px}.collage .st{width:44px;height:44px}.collage .st.c{width:36px;height:36px}}
/* ---- place photos + live map ---- */
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:var(--surface-2);margin-bottom:6px;max-width:100%}
.stop .mini{width:64px;height:48px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--surface-2)}
.stop .body{display:grid;grid-template-columns:1fr;gap:4px}
.stop .row{display:flex;gap:10px;align-items:flex-start;position:relative}
.stop .mini{transition:transform .18s ease,box-shadow .18s ease;transform-origin:top left;position:relative}
@media (hover:hover){.stop .mini:hover{transform:scale(5);z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.45);border-radius:3px}}
.stop{overflow:visible}
.drawer .hero-img{width:auto;max-width:100%;max-height:min(60vh,520px);height:auto;object-fit:contain;border-radius:12px;display:block;margin:0 auto 12px;background:var(--surface-2)}
.drawer .place{max-width:900px;margin:0 auto}
.lmap{height:520px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:var(--surface-2)}
@media (max-width:760px){.lmap{height:420px}}
.leaflet-container{font-family:var(--body)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--fg);border-radius:12px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:10px 12px;font-size:.85rem;line-height:1.4;min-width:180px}
.leaflet-popup-content img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
.leaflet-popup-content .pn{font-weight:600;font-size:.95rem}
.leaflet-popup-content a{color:var(--pick)}
.leaflet-control-zoom a{background:var(--surface);color:var(--fg);border-color:var(--line)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);font-size:.65rem}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.src-note{font-size:.72rem;color:var(--muted)}

.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6)}

</style>

(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TRIP=window.TRIP, PLACES=window.PLACES, SUGG=window.SUGGESTIONS, DAYS=window.DAYS;
const ALL={};
PLACES.forEach(p=>{ALL[p.id]=p;});
SUGG.forEach(s=>{ALL[s.id]=Object.assign({src:s.you?'you':'pick',list:s.you?'Your notes':'Claude pick',note:'',reviews:null,rating:null,tip:''},s);});
const fmtY=n=>'¥'+Math.round(n).toLocaleString('en-US');
const fmtR=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function niceDate(iso){const [y,m,d]=iso.split('-').map(Number);return `${DOWS[new Date(Date.UTC(y,m-1,d)).getUTCDay()]} ${MONTHS[m-1]} ${d}`;}
function todayJST(){try{return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'});}catch(e){return new Date().toISOString().slice(0,10);}}
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000);}
function mapsLink(p){ if(p.maps) return p.maps; return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+' '+(p.area||'Japan')); }
function dirLink(a,b,mode){return `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=${mode}`;}
function hav(a,b){const R=6371,toR=x=>x*Math.PI/180;const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function estHop(km,drive){ if(drive) return {min:Math.round(km/35*60+5),mode:'drive'}; if(km<1.3) return {min:Math.round(km/4.5*60),mode:'walk'}; return {min:Math.round(12+km*2.2),mode:'transit'}; }
const ICON=(n,c='')=>`<svg class="ico ${c}" aria-hidden="true"><use href="#k-${n}"/></svg>`;
const TAB_ICON={today:'daruma',days:'train',map:'fuji',places:'lantern',shop:'bag',check:'sparkle',budget:'yen',guide:'neko'};
const DAY_MASCOT={1:'robot',2:'camera',3:'car',4:'fuji',5:'torii',6:'momiji',7:'deer',8:'controller',9:'skytree',10:'plane'};
const TAG_ICON={cyberpunk:'robot',drinking:'beer',shopping:'bag',vintage:'camera',drive:'car',nature:'momiji',chill:'onsen',countryside:'ginkgo',culture:'torii',food:'ramen',spirituality:'torii',anime:'controller',arcade:'controller',travel:'plane'};
function catIcon(p){const t=((p.cat||'')+' '+(p.list||'')).toLowerCase(); const has=r=>r.test(t);
  if(has(/hotel|hostel|inn|ryokan/)) return 'onsen'; if(has(/car rental|jdm|toll road|cafe/)&&!has(/dog/)) return 'car'; if(has(/dog cafe/)) return 'shiba';
  if(has(/temple|shrine|cemetery/)) return 'torii'; if(has(/camera/)) return 'camera'; if(has(/knife|martial/)) return 'katana';
  if(has(/ramen|udon|sushi|pizza|restaurant|curry|wings|steak|donburi|kaiseki|yakiniku|bakery|mochi|wagashi|food market|confection|tsukemen/)) return 'ramen';
  if(has(/bar|yakitori|tachinomi|izakaya/)) return 'beer'; if(has(/tea shop/)) return 'tea'; if(has(/arcade|game|retro/)) return 'controller';
  if(has(/store|shopping|mall|market|flea|antique|records|stationery|sneakers|toy|collectibles|thrift|electronics|fabric|discount/)) return 'bag';
  if(has(/station|airport|train/)) return 'train'; if(has(/viewpoint|garden|park|scenic|island|river|valley|bridge|forest|lake|avenue|pass|road|skyline|turnpike/)) return 'momiji';
  if(has(/museum|castle|aquarium|observation|theater|digital art|showroom|historic|landmark/)) return 'lantern'; return 'onigiri'; }
function photoFor(key){return (window.PHOTOS||{})[key]||null;}
function placePhoto(id){const r=(window.PLACE_PHOTOS||{})[id]; return r&&r.file?r:null;}
function srcChip(p){return p.src==='you'?`<span class="chip you">Your list</span>`:`<span class="chip pick">Claude pick</span>`;}

// ---------- state + storage ----------
const STATE={checks:{},budget:{tier:'mid',rate:TRIP.rateINRperJPY,over:{}},expenses:[],updated:0};
function merge(d){ if(!d||typeof d!=='object') return; if(d.checks) STATE.checks=Object.assign({},d.checks); if(d.budget) STATE.budget=Object.assign({tier:'mid',rate:TRIP.rateINRperJPY,over:{}},d.budget); if(Array.isArray(d.expenses)) STATE.expenses=d.expenses.slice(); if(d.updated) STATE.updated=d.updated; }
let saveTimer=null, writeChain=Promise.resolve();
const Store={docRef:null,
  async init(){
    try{const raw=localStorage.getItem('japan-trip-state'); if(raw) merge(JSON.parse(raw));}catch(e){}
    try{
      if(window.claude&&typeof window.claude.use==='function'){
        const db=await window.claude.use('db');
        if(db){ this.docRef=db.doc('trip/state');
          this.docRef.onSnapshot(snap=>{
            if(!snap.exists){ if(STATE.updated) Store.push(); return; }
            const d=snap.data()||{};
            if((d.updated||0)>(STATE.updated||0)){ merge(d); try{localStorage.setItem('japan-trip-state',JSON.stringify(STATE));}catch(e){} renderCurrent(); setSync('Synced'); }
            else if((d.updated||0)<(STATE.updated||0)) Store.push();
            else setSync('Synced');
          },err=>{console.warn('db',err); setSync('This device only');});
        } else setSync('This device only');
      } else setSync('This device only');
    }catch(e){console.warn(e); setSync('This device only');}
  },
  save(){ STATE.updated=Date.now(); try{localStorage.setItem('japan-trip-state',JSON.stringify(STATE));}catch(e){} clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.push(),700); },
  push(){ if(!this.docRef) return; const body=JSON.parse(JSON.stringify(STATE)); writeChain=writeChain.then(()=>this.docRef.set(body)).then(()=>setSync('Synced'),e=>{console.warn(e); setSync('Saved on this device');}); }
};
function setSync(t){const el=$('#sync'); if(el) el.textContent=t;}
function isChecked(id){return !!STATE.checks[id];}
function toggle(id,v){ if(v) STATE.checks[id]=true; else delete STATE.checks[id]; Store.save(); }

// ---------- toast + drawer ----------
let toastT=null; function toast(t){const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1400);}
function openPlace(id){ const p=ALL[id]; if(!p) return; const dayFor=DAYS.filter(d=>d.stops.some(s=>s.ref===id&&!s.opt)); const dayTxt=dayFor.length?dayFor.map(d=>`<a class="link" href="#day${d.n}" data-go="days" data-day="${d.n}">Day ${d.n} · ${niceDate(d.date)}</a>`).join(' · '):(p.day?`suggested Day ${p.day}`:'not scheduled');
  const pp=placePhoto(p.id); $('#drawer-body').innerHTML=`<div class="place">${pp?`<img class="hero-img" src="${esc(pp.file)}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="head"><span class="sticker">${ICON(catIcon(p))}</span><b>${esc(p.name)}</b> ${srcChip(p)} <span class="chip tag">${esc(p.cat||'')}</span></div>
  ${p.rating?`<div class="rating">★ ${p.rating} · ${Number(p.reviews||0).toLocaleString('en-US')} reviews · ${esc(p.list)}</div>`:`<div class="rating">${esc(p.list)}</div>`}
  <dl class="kv">
   ${p.area?`<dt>Area</dt><dd>${esc(p.area)}</dd>`:''}
   ${p.address?`<dt>Address</dt><dd>${esc(p.address)}</dd>`:''}
   ${p.hours?`<dt>Hours</dt><dd>${esc(p.hours)}</dd>`:''}
   ${p.best?`<dt>Best time</dt><dd>${esc(p.best)}</dd>`:''}
   ${p.use?`<dt>Why</dt><dd>${esc(p.use)}</dd>`:''}
   ${p.note?`<dt>Your note</dt><dd>“${esc(p.note)}”</dd>`:''}
   ${p.tip?`<dt>Tip</dt><dd>${esc(p.tip)}</dd>`:''}
   <dt>When</dt><dd>${dayTxt}</dd>
  </dl>
  ${pp&&pp.page?`<div class="src-note">Photo: <a target="_blank" rel="noopener" href="${esc(pp.page)}">${esc((pp.title||pp.page).slice(0,70))}</a></div>`:''}
  <div class="pills"><a class="btn small" target="_blank" rel="noopener" href="${esc(mapsLink(p))}">Open in Google Maps</a><a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=transit">Directions here</a></div></div>`;
  $('#drawer').hidden=false; $('#scrim').hidden=false; }
function closeDrawer(){$('#drawer').hidden=true; $('#scrim').hidden=true;}

// ---------- tabs ----------
const TABS=[['today','Today'],['days','Days'],['map','Map'],['places','Places'],['shop','Shop & eat'],['check','Checklist'],['budget','Budget'],['guide','Guide']];
let current='today';
function show(tab,opts){ if(!TABS.some(t=>t[0]===tab)) tab='today'; current=tab; document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false')); document.querySelectorAll('section.view').forEach(s=>s.hidden=s.id!=='view-'+tab); renderCurrent(); if(history.replaceState) history.replaceState(null,'','#'+tab); window.scrollTo({top:0}); if(opts&&opts.day){ const el=document.getElementById('day-'+opts.day); if(el) el.scrollIntoView({block:'start'}); } }
function renderCurrent(){ ({today:renderToday,days:renderDays,map:renderMap,places:renderPlaces,shop:renderShop,check:renderCheck,budget:renderBudget,guide:renderGuide})[current](); renderHeader(); }

// ---------- header ----------
function renderHeader(){ const t=todayJST(); const n=daysBetween(t,TRIP.start); let txt; if(n>0) txt=`<b>${n}</b> days to Haneda`; else if(t<=TRIP.end) txt=`Day <b>${daysBetween(TRIP.start,t)+1}</b> of 10 · ${niceDate(t)}`; else txt='Trip complete'; $('#countdown').innerHTML=txt; }

// ---------- day card ----------
function stopName(s){ if(s.ref){const p=ALL[s.ref]; if(!p) return esc(s.title||s.ref); return `<button class="pl" data-place="${p.id}">${esc(p.name)}</button> ${srcChip(p)}`;} return esc(s.title||''); }
function dayCard(d){ let prev=null; const mode=d.drive?'driving':'transit';
  const rows=d.stops.map((s,i)=>{ const p=s.ref?ALL[s.ref]:null; const id=`done:${d.n}:${i}`; const done=isChecked(id); let dir='';
    if(p&&p.lat){ if(prev&&!s.opt&&prev.id!==p.id) dir=`<a class="link" target="_blank" rel="noopener" href="${esc(dirLink(prev,p,mode))}">Directions from ${esc(prev.name.split(' (')[0])}</a>`; if(!s.opt) prev=p; }
    const hours=p&&p.hours?`<span class="muted mono">${esc(p.hours)}</span>`:'';
    const pp=p?placePhoto(p.id):null;
    return `<div class="stop${s.opt?' opt':''}${done?' done':''}"><div class="t">${esc(s.t)}</div><div class="row">${pp?`<img class="mini" src="${esc(pp.file)}" alt="" loading="lazy" data-place="${p.id}" style="cursor:pointer">`:''}<div class="body" style="min-width:0">
      <div class="name">${stopName(s)}</div>
      ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
      ${s.travel?`<div class="travel">→ ${esc(s.travel)}</div>`:''}
      <div class="meta">${hours}${p?`<a class="link" target="_blank" rel="noopener" href="${esc(mapsLink(p))}">Maps</a>`:''}${dir}<label class="small muted"><input type="checkbox" data-check="${id}" ${done?'checked':''}> done</label></div>
    </div></div></div>`; }).join('');
  const tags=(d.tags||[]).map(t=>`<span class="chip tag ${esc(t)}">${TAG_ICON[t]?ICON(TAG_ICON[t]):''}${esc(t)}</span>`).join('')+(d.chill?`<span class="chip pick">${ICON('onsen')}chill day</span>`:'')+(d.drive?`<span class="chip you">${ICON('car')}car day</span>`:'')+(d.holiday?'<span class="chip tag">public holiday</span>':'');
  const ph=photoFor('d'+d.n); const cover=ph?`<div class="cover"><img src="${esc(ph.file)}" alt="${esc(ph.alt||'')}" loading="lazy"><span class="daynum">Day ${d.n}</span><span class="credit">📷 ${esc(ph.artist.split(' ')[0]||'Commons')}</span><span class="mascot sticker lg">${ICON(DAY_MASCOT[d.n]||'onigiri')}</span></div>`:'';
  return `<article class="card day" id="day-${d.n}">${cover}<div class="day-head"><span class="date">Day ${d.n} · ${niceDate(d.date)}</span><h2>${esc(d.title)}</h2></div>
   <div class="chips">${tags}<span class="chip day">stay: ${esc(d.base)}</span><span class="chip day">≈ ${fmtY(d.budget)} · ${fmtR(d.budget*STATE.budget.rate)}</span></div>
   <p class="why">${esc(d.why)}</p><div class="stops">${rows}</div></article>`; }

// ---------- views ----------
function renderToday(){ const t=todayJST(); const v=$('#view-today'); const n=daysBetween(t,TRIP.start);
  const openBookings=window.CHECKLISTS[0].items.filter(i=>!isChecked(i.id));
  if(n>0){ const d=DAYS[0]; v.innerHTML=`<div class="stack"><div class="card hero"><div class="h-row"><span class="sticker lg">${ICON('plane')}</span><span class="sticker lg">${ICON('onigiri')}</span><span class="sticker lg">${ICON('neko')}</span></div><span class="eyebrow">Countdown</span><div class="big">${n} days until Haneda</div><p class="muted">Lands ${niceDate(TRIP.start)} 15:05 · home ${niceDate(TRIP.end)} 22:30. Nine nights: Tokyo 2, Hakone 1, Ito 1, Kyoto 2, Osaka 1, Tokyo 2.</p>
    <div class="pills"><button class="btn primary" data-go="check">Bookings left: ${openBookings.length}</button><button class="btn" data-go="days">Read the plan</button><button class="btn" data-go="budget">Set the budget</button></div></div>

function project(b,W,H,pad){const [minLat,minLng,maxLat,maxLng]=b;const cos=Math.cos((minLat+maxLat)/2*Math.PI/180);const sc=Math.min((W-2*pad)/((maxLng-minLng)*cos),(H-2*pad)/(maxLat-minLat));const ox=(W-(maxLng-minLng)*cos*sc)/2, oy=(H-(maxLat-minLat)*sc)/2;return (lat,lng)=>[ox+(lng-minLng)*cos*sc, oy+(maxLat-lat)*sc];}

  $('#view-shop').innerHTML=`<div class="stack"><div class="card flat"><span class="eyebrow">Your list, mapped to shops and days</span><div class="h-row"><span class="sticker lg">${ICON('bag')}</span><span class="sticker lg">${ICON('ramen')}</span><h1>Shopping and eating</h1></div><p class="muted">Tick as you buy. The 7 kg cabin limit on the way home is the real constraint; heavy things go in the 25 kg checked bag.</p></div>
   <div class="card"><div class="day-head"><h2>Things to get</h2><span class="muted mono small">${sdone}/${window.SHOPPING.length}</span></div><div class="progress"><i style="width:${sdone/window.SHOPPING.length*100}%"></i></div>${listRows(window.SHOPPING,'shop')}</div>
   <div class="card"><div class="day-head"><h2>Things to eat</h2><span class="muted mono small">${fdone}/${window.FOOD.length}</span></div><div class="progress"><i style="width:${fdone/window.FOOD.length*100}%"></i></div>${listRows(window.FOOD,'food')}</div></div>`; }

// ---------- checklist ----------
function renderCheck(){ $('#view-check').innerHTML=`<div class="stack"><div class="card flat"><span class="eyebrow">Before, during, after</span><div class="h-row"><span class="sticker lg">${ICON('daruma')}</span><h1>Checklist</h1></div></div>${window.CHECKLISTS.map(g=>{const done=g.items.filter(i=>isChecked(i.id)).length; const gi=['sparkle','lantern','robot','bag','daruma'][window.CHECKLISTS.indexOf(g)]||'onigiri'; return `<div class="card"><div class="day-head"><span class="sticker">${ICON(gi)}</span><h2>${esc(g.group)}</h2><span class="muted mono small">${done}/${g.items.length}</span></div><div class="progress"><i style="width:${done/g.items.length*100}%"></i></div>${g.items.map(i=>`<div class="check${isChecked(i.id)?' done':''}"><input type="checkbox" id="c-${i.id}" data-check="${i.id}" ${isChecked(i.id)?'checked':''}><label for="c-${i.id}">${esc(i.text)}${i.ref&&ALL[i.ref]?` <button class="chip ${ALL[i.ref].src==='you'?'you':'pick'} pl" style="border:0;cursor:pointer" data-place="${i.ref}">${esc(ALL[i.ref].name.split(' (')[0])}</button>`:''}</label></div>`).join('')}</div>`;}).join('')}</div>`; }

// ---------- budget ----------
const SLOT=['s1','s2','s3','s4','s5','s6','s7','s8'];
function planFor(c){const o=STATE.budget.over[c.key]; return (o!=null&&!isNaN(o))?Number(o):c[STATE.budget.tier];}
function spentFor(key){return STATE.expenses.filter(e=>e.cat===key).reduce((a,e)=>a+Number(e.amt||0),0);}
function renderBudget(){ const B=window.BUDGET, rate=STATE.budget.rate; const v=$('#view-budget');
  const tot=k=>B.cats.reduce((a,c)=>a+c[k],0); const plan=B.cats.reduce((a,c)=>a+planFor(c),0); const spent=STATE.expenses.reduce((a,e)=>a+Number(e.amt||0),0);
  const rows=B.cats.map((c,i)=>`<tr><td><span class="swatch" style="background:var(--${SLOT[i]})"></span>${esc(c.label)}<div class="small muted">${esc(c.note)}</div></td><td class="num">${fmtY(c.lean)}</td><td class="num">${fmtY(c.mid)}</td><td class="num">${fmtY(c.splurge)}</td><td class="num"><input class="amt" type="number" inputmode="numeric" data-over="${c.key}" value="${planFor(c)}"></td><td class="num" data-spent="${c.key}">${fmtY(spentFor(c.key))}</td></tr>`).join('');
  v.innerHTML=`<div class="stack"><div class="card flat"><span class="eyebrow">Flights already paid · ₹2–4 lakh on the ground</span><div class="h-row"><span class="sticker lg">${ICON('yen')}</span><h1>Budget</h1></div><p class="muted">Three tiers in yen, converted at your rate. Edit any cell to make it your plan; log spends below and the chart tracks them.</p>
   <div class="filters"><div class="tiers">${['lean','mid','splurge'].map(t=>`<button class="btn small" data-tier="${t}" aria-pressed="${STATE.budget.tier===t}">${t==='lean'?'Lean ≈ ₹2L':t==='mid'?'Mid ≈ ₹3L':'Splurge ≈ ₹4L'}</button>`).join('')}</div><label class="small muted">₹ per ¥ <input class="amt" id="rate" type="number" step="0.001" value="${rate}"></label><button class="btn small" id="resetover">Reset edits</button></div></div>
   <div class="totals"><div class="tile"><span class="sticker">${ICON('yen')}</span><div><div class="v" id="t-plan">${fmtY(plan)}</div><div class="l">your plan</div></div></div><div class="tile"><span class="sticker">${ICON('sparkle')}</span><div><div class="v" id="t-planr">${fmtR(plan*rate)}</div><div class="l">in rupees</div></div></div><div class="tile"><span class="sticker">${ICON('bag')}</span><div><div class="v" id="t-spent">${fmtY(spent)}</div><div class="l">spent so far · ${fmtR(spent*rate)}</div></div></div><div class="tile"><span class="sticker">${ICON('daruma')}</span><div><div class="v" id="t-left">${fmtY(plan-spent)}</div><div class="l">left</div></div></div></div>
   <div class="chart" id="chart"></div>
   <div class="card"><div class="tablewrap"><table><thead><tr><th>Category</th><th class="num">Lean</th><th class="num">Mid</th><th class="num">Splurge</th><th class="num">Your plan</th><th class="num">Spent</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th>Total</th><th class="num">${fmtY(tot('lean'))}<br><span class="muted">${fmtR(tot('lean')*rate)}</span></th><th class="num">${fmtY(tot('mid'))}<br><span class="muted">${fmtR(tot('mid')*rate)}</span></th><th class="num">${fmtY(tot('splurge'))}<br><span class="muted">${fmtR(tot('splurge')*rate)}</span></th><th class="num" id="f-plan">${fmtY(plan)}</th><th class="num" id="f-spent">${fmtY(spent)}</th></tr></tfoot></table></div></div>
   <div class="card"><h2>Spend log</h2><form class="exp" id="expform"><input name="desc" placeholder="What (e.g. Fujiya X-E3)" required><input name="amt" type="number" inputmode="numeric" placeholder="¥ amount" required min="1"><select name="cat">${B.cats.map(c=>`<option value="${c.key}">${esc(c.label)}</option>`).join('')}</select><input name="date" type="date" value="${todayJST()}"><button class="btn primary full" type="submit">Add spend</button></form><div id="explist">${expRows()}</div></div></div>`;
  drawChart();
  v.querySelectorAll('[data-tier]').forEach(b=>b.addEventListener('click',()=>{STATE.budget.tier=b.dataset.tier; STATE.budget.over={}; Store.save(); renderBudget();}));
  $('#rate').addEventListener('change',e=>{const r=Number(e.target.value); if(r>0){STATE.budget.rate=r; Store.save(); renderBudget();}});
  $('#resetover').addEventListener('click',()=>{STATE.budget.over={}; Store.save(); renderBudget();});
  v.querySelectorAll('[data-over]').forEach(inp=>inp.addEventListener('input',e=>{const val=e.target.value; if(val==='') delete STATE.budget.over[inp.dataset.over]; else STATE.budget.over[inp.dataset.over]=Number(val); Store.save(); updateTotals();}));
  $('#expform').addEventListener('submit',e=>{e.preventDefault(); const f=new FormData(e.target); STATE.expenses.push({id:Date.now().toString(36),desc:String(f.get('desc')).slice(0,80),amt:Number(f.get('amt')),cat:String(f.get('cat')),date:String(f.get('date')||todayJST())}); Store.save(); renderBudget(); toast('Logged');});
  v.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{STATE.expenses=STATE.expenses.filter(x=>x.id!==b.dataset.del); Store.save(); renderBudget();})); }
function expRows(){ if(!STATE.expenses.length) return `<div class="empty"><span class="sticker lg">${ICON('onigiri')}</span><p class="small">No spends yet. The first one is probably a 7-Eleven egg sando.</p></div>`; const B=window.BUDGET; const byDate=STATE.expenses.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id>a.id?1:-1)); return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>What</th><th>Category</th><th class="num">¥</th><th class="num">₹</th><th></th></tr></thead><tbody>${byDate.map(e=>{const c=B.cats.find(c=>c.key===e.cat)||{label:e.cat}; return `<tr><td class="mono">${esc(e.date)}</td><td>${esc(e.desc)}</td><td class="small muted">${esc(c.label)}</td><td class="num">${fmtY(e.amt)}</td><td class="num muted">${fmtR(e.amt*STATE.budget.rate)}</td><td><button class="btn small" data-del="${e.id}" aria-label="Delete">×</button></td></tr>`;}).join('')}</tbody></table></div>`; }
function updateTotals(){ const B=window.BUDGET, rate=STATE.budget.rate; const plan=B.cats.reduce((a,c)=>a+planFor(c),0); const spent=STATE.expenses.reduce((a,e)=>a+Number(e.amt||0),0); $('#t-plan').textContent=fmtY(plan); $('#t-planr').textContent=fmtR(plan*rate); $('#t-left').textContent=fmtY(plan-spent); $('#f-plan').textContent=fmtY(plan); drawChart(); }
function drawChart(){ const B=window.BUDGET; const series=[{label:'Lean',vals:B.cats.map(c=>c.lean)},{label:'Mid',vals:B.cats.map(c=>c.mid)},{label:'Splurge',vals:B.cats.map(c=>c.splurge)},{label:'Your plan',vals:B.cats.map(planFor)},{label:'Spent',vals:B.cats.map(c=>spentFor(c.key))}];
  const W=760,rowH=34,left=86,right=118,top=30,H=top+series.length*rowH+36; const max=Math.max(...series.map(s=>s.vals.reduce((a,b)=>a+b,0)),1); const sc=(W-left-right)/max;
  const ticks=[0,200000,400000,600000,800000].filter(t=>t<=max*1.05);
  let g=ticks.map(t=>`<line x1="${(left+t*sc).toFixed(1)}" y1="${top-6}" x2="${(left+t*sc).toFixed(1)}" y2="${H-30}" stroke="var(--grid)"/><text x="${(left+t*sc).toFixed(1)}" y="${H-14}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${t?'¥'+(t/1000)+'k':'¥0'}</text>`).join('');
  series.forEach((s,si)=>{ let x=left; const y=top+si*rowH; const total=s.vals.reduce((a,b)=>a+b,0); g+=`<text x="${left-8}" y="${y+16}" font-size="11" text-anchor="end" fill="var(--fg)" font-family="var(--body)">${s.label}</text>`; s.vals.forEach((val,ci)=>{ const w=val*sc; if(w>0){ g+=`<rect x="${(x+1).toFixed(1)}" y="${y+2}" width="${Math.max(0,w-2).toFixed(1)}" height="${rowH-8}" rx="${ci===s.vals.length-1?3:0}" fill="var(--${SLOT[ci]})"><title>${esc(s.label)} · ${esc(B.cats[ci].label)}: ${fmtY(val)}</title></rect>`; x+=w; } }); if(total>0) g+=`<text x="${(x+6).toFixed(1)}" y="${y+16}" font-size="11" fill="var(--fg)" font-family="var(--mono)">${fmtY(total)}</text>`; });
  const legend=B.cats.map((c,i)=>`<span><i class="swatch" style="background:var(--${SLOT[i]})"></i>${esc(c.label.split(' (')[0])}</span>`).join('');
  $('#chart').innerHTML=`<div class="eyebrow" style="margin-bottom:6px">Yen by category · three tiers, your plan, and what you have spent</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked budget bars">${g}</svg><div class="legend">${legend}</div>`; }

// ---------- guide ----------
function renderGuide(){ const G=window.GUIDE; $('#view-guide').innerHTML=`<div class="stack guide"><div class="card flat"><span class="eyebrow">Sidekick</span><div class="h-row"><span class="sticker lg">${ICON('neko')}</span><h1>Guide</h1></div></div>
  <div class="card"><h3>Flights</h3><p class="small"><b>Out</b> ${esc(TRIP.flights.out)}</p><p class="small"><b>Back</b> ${esc(TRIP.flights.back)}</p></div>
  ${G.map(s=>`<div class="card" id="g-${s.id}"><h3>${esc(s.title)}</h3>${s.rows?`<div class="tablewrap"><table><tbody>${s.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'':'muted'}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}${s.text?`<p class="small">${esc(s.text)}</p>`:''}</div>`).join('')}
  <div class="card"><h3>Fourteen phrases that open doors</h3>${window.PHRASES.map(p=>`<div class="phr"><div class="jp">${esc(p.jp)}</div><div class="ro">${esc(p.romaji)}</div><div class="small muted">${esc(p.en)}</div></div>`).join('')}</div>
  <div class="card"><h3>Photo credits</h3><p class="small muted">Photos are from Wikimedia Commons under the licences shown; stickers are drawn for this site.</p><div class="credits">${Object.entries(window.PHOTOS||{}).map(([k,ph])=>`<div>${esc(k.toUpperCase())}: <a target="_blank" rel="noopener" href="${esc(ph.page)}">${esc(ph.title)}</a> · ${esc(ph.artist||'unknown')} · ${esc(ph.lic)}</div>`).join('')}</div></div>
  <div class="card"><h3>Place photo sources</h3><p class="small muted">Place thumbnails were pulled from the web for personal use; each drawer shows the page it came from.</p><div class="credits">${Object.entries(window.PLACE_PHOTOS||{}).filter(([k,v])=>v).map(([k,v])=>`<div>${esc((ALL[k]||{}).name||k)}: <a target="_blank" rel="noopener" href="${esc(v.page||v.src)}">${esc((v.title||v.page||v.src).slice(0,60))}</a></div>`).join('')}</div></div>
  <div class="card"><h3>What this site is</h3><p class="small muted">Built from your 7 Google Maps lists (79 places, with the hours and ratings Maps shows), your notes, and the flights in your visa folder. Everything marked “Claude pick” is a suggestion, not something you saved. Ticks, budget edits and spends are stored with the page and sync between your devices when you are signed in; otherwise they stay in this browser.</p></div></div>`; }

// ---------- events ----------
document.addEventListener('click',e=>{ const t=e.target.closest('[data-place],[data-go],[data-tab],#drawer-close,#scrim'); if(!t) return;
  if(t.id==='drawer-close'||t.id==='scrim'){closeDrawer();return;}
  if(t.dataset.place){e.preventDefault(); openPlace(t.dataset.place); return;}
  if(t.dataset.tab){show(t.dataset.tab); return;}
  if(t.dataset.go){e.preventDefault(); closeDrawer(); if(t.dataset.mapday){MAPV.day=Number(t.dataset.mapday); const d=DAYS.find(x=>x.n===MAPV.day); MAPV.view=d.n<=2||d.n>=8?'tokyo':(d.n<=4?'fuji':'kansai');} show(t.dataset.go,{day:t.dataset.day?Number(t.dataset.day):0}); } });
document.addEventListener('change',e=>{ const c=e.target.closest('[data-check]'); if(!c) return; toggle(c.dataset.check,c.checked); const row=c.closest('.check,.stop'); if(row) row.classList.toggle('done',c.checked); if(current==='check'||current==='shop') renderCurrent(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

// ---------- boot ----------
function boot(){ $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-selected="false">${ICON(TAB_ICON[k])}<span>${l}</span></button>`).join(''); const h=(location.hash||'').replace('#',''); const m=h.match(/^day(\d+)$/); if(m){ current='days'; } else if(TABS.some(t=>t[0]===h)) current=h; show(current, m?{day:Number(m[1])}:undefined); Store.init(); }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();

</script>
</body></html>
